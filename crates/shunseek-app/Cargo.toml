[package]
name = "shunseek-app"
version = "0.1.0"
edition = "2021"
description = "瞬觅 ShunSeek 界面（Rust 版，egui 重绘）：DeskBox 式小悬浮窗 + 全局热键 + 托盘"

[dependencies]
shunseek-core = { path = "../shunseek-core" }
eframe = "0.29"
egui = "0.29"

# 托盘：只在 Windows 目标启用。
# tray-icon 在 Linux 上要拉 GTK / appindicator 系统库，无头构建机上没有，
# 所以非 Windows 目标不引入这个依赖，托盘模块退化为骨架（见 src/tray.rs）。
[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
