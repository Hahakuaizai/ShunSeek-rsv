name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # 本地 .cargo/config.toml 把 target-dir 指到 ../build/target（仓库外），
    # CI 里没有那个目录、缓存也按仓库内 target 走，这里显式覆盖回来。
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release
        continue-on-error: true

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target\release\shunseek-app.exe out\ShunSeek.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ShunSeek-windows
          path: out/ShunSeek.exe
